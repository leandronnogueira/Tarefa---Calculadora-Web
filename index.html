<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculadora">
        <div class="tela">
            <div id="conta"></div>
            <div id="visor">0</div>
        </div>

        <div class="botoes">
            <button class="btn limpar dois" data-acao="limpar">C</button>
            <button class="btn cinza" data-acao="apagar">⌫</button>
            <button class="btn op" data-op="÷">÷</button>

            <button class="btn" data-num="7">7</button>
            <button class="btn" data-num="8">8</button>
            <button class="btn" data-num="9">9</button>
            <button class="btn op" data-op="×">×</button>

            <button class="btn" data-num="4">4</button>
            <button class="btn" data-num="5">5</button>
            <button class="btn" data-num="6">6</button>
            <button class="btn op" data-op="-">-</button>

            <button class="btn" data-num="1">1</button>
            <button class="btn" data-num="2">2</button>
            <button class="btn" data-num="3">3</button>
            <button class="btn op" data-op="+">+</button>

            <button class="btn dois" data-num="0">0</button>
            <button class="btn" data-acao="ponto">.</button>
            <button class="btn igual" data-acao="igual">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
